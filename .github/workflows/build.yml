name: Build RobloxSwitch

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Inspect source
        run: |
          pwd
          find . -maxdepth 3 -type f
          test -s source/main.c

      - name: Inspect Make variables
        run: |
          make -pn | grep -E '^(TARGET|SOURCES|CFILES|OFILES_SRC|OFILES) ?[:=]'

      - name: Build NRO
        run: |
          make clean
          make V=1

      - name: Verify NRO
        run: |
          test -s RobloxSwitch.nro
          file RobloxSwitch.nro
          ls -lh RobloxSwitch.nro

      - uses: actions/upload-artifact@v4
        with:
          name: RobloxSwitch-NRO
          path: RobloxSwitch.nro
