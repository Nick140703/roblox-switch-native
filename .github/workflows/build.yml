name: Build RobloxSwitch

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Inspect toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          ls -la "$DEVKITPRO"
          ls -la "$DEVKITPRO/libnx"
          test -f "$DEVKITPRO/libnx/switch_rules"

      - name: Build NRO
        run: |
          make -j2

      - name: Verify output
        run: |
          test -f RobloxSwitch.nro
          file RobloxSwitch.nro
          ls -lh RobloxSwitch.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: RobloxSwitch-NRO
          path: RobloxSwitch.nro
